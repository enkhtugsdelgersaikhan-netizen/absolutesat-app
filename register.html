<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AbsolutePrep</title>

    <link
        rel="icon"
        type="image/png"
        href="Favicon.png"
    >

    <!-- Poppins -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="auth-header">

        <div class="auth-header-container">

            <a
                href="/"
                class="auth-logo-link"
            >

                <img
                    src="Logo.png"
                    alt="AbsolutePrep"
                    class="auth-logo"
                >

            </a>


            <a
                href="/"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </header>



    <!-- =========================================
         REGISTER PAGE
    ========================================== -->

    <main class="auth-page">

        <section class="auth-card">


            <h1 class="auth-heading">
                Create your account
            </h1>


            <p class="auth-subheading">
                Join AbsolutePrep and start practicing smarter.
            </p>



            <!-- =====================================
                 REGISTER FORM
            ====================================== -->

            <form
                id="register-form"
                class="auth-form"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>


                    <input
                        id="email"
                        type="email"
                        class="form-input"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>


                    <input
                        id="password"
                        type="password"
                        class="form-input"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label
                        for="confirm-password"
                        class="form-label"
                    >
                        Confirm password
                    </label>


                    <input
                        id="confirm-password"
                        type="password"
                        class="form-input"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    id="register-button"
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>


            </form>



            <!-- =====================================
                 DIVIDER
            ====================================== -->

            <div class="auth-divider">

                <span>or</span>

            </div>



            <!-- =====================================
                 GOOGLE BUTTON
            ====================================== -->

            <button
                id="google-button"
                type="button"
                class="google-button"
            >


                <svg
                    class="google-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        fill="#4285F4"
                        d="M21.35 12.27c0-.78-.07-1.53-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.39z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.5A9.74 9.74 0 0 0 12 21.5z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.53 13.6A5.85 5.85 0 0 1 6.23 12c0-.56.1-1.1.3-1.6V7.9H3.29A9.5 9.5 0 0 0 2.5 12c0 1.48.35 2.88.79 4.1l3.24-2.5z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.49 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.4l3.24 2.5C7.3 8.1 9.46 6.38 12 6.38z"
                    />

                </svg>


                Continue with Google


            </button>



            <!-- =====================================
                 MESSAGE
            ====================================== -->

            <div
                id="auth-message"
                class="auth-message"
            ></div>



            <!-- =====================================
                 LOGIN LINK
            ====================================== -->

            <p class="auth-bottom-text">

                Already have an account?

                <a href="/login">
                    Log in
                </a>

            </p>


        </section>

    </main>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="/supabase-config.js"></script>



    <!-- =========================================
         REGISTER JAVASCRIPT
    ========================================== -->

    <script>

        const registerForm =
            document.getElementById("register-form");

        const registerButton =
            document.getElementById("register-button");

        const googleButton =
            document.getElementById("google-button");

        const message =
            document.getElementById("auth-message");



        /* =====================================
           SHOW MESSAGE
        ====================================== */

        function showMessage(text, type) {

            message.innerHTML = text;

            message.className =
                "auth-message show " + type;

        }



        /* =====================================
           BUTTON LOADING
        ====================================== */

        function setLoading(
            button,
            loading,
            text
        ) {

            button.disabled = loading;


            if (loading) {

                button.innerHTML = `
                    <span class="button-loading">
                        <span class="spinner"></span>
                        ${text}
                    </span>
                `;

            } else {

                button.textContent = text;

            }

        }



        /* =====================================
           EMAIL REGISTRATION
        ====================================== */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                message.className =
                    "auth-message";


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirm-password")
                        .value;



                /* ================================
                   CHECK PASSWORDS
                ================================= */

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }



                /* ================================
                   PASSWORD LENGTH
                ================================= */

                if (password.length < 6) {

                    showMessage(
                        "Your password must be at least 6 characters.",
                        "error"
                    );

                    return;

                }



                /* ================================
                   LOADING
                ================================= */

                setLoading(
                    registerButton,
                    true,
                    "Creating account..."
                );



                /* ================================
                   SUPABASE SIGN UP
                ================================= */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            emailRedirectTo:
                                window.location.origin + "/"

                        }

                    });



                /* ================================
                   STOP LOADING
                ================================= */

                setLoading(
                    registerButton,
                    false,
                    "Create Account"
                );



                /* ================================
                   SUPABASE ERROR
                ================================= */

                if (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                    return;

                }



                /* ================================
                   EXISTING ACCOUNT CHECK
                ================================= */

                if (
                    data.user &&
                    data.user.identities &&
                    data.user.identities.length === 0
                ) {

                    showMessage(
                        'An account with this email already exists. <a href="/login">Log in here.</a>',
                        "error"
                    );

                    return;

                }



                /* ================================
                   ACCOUNT CREATED + LOGGED IN
                ================================= */

                if (
                    data.user &&
                    data.session
                ) {

                    window.location.href = "/";

                    return;

                }



                /* ================================
                   EMAIL CONFIRMATION
                ================================= */

                showMessage(
                    "Account created successfully. Please check your email to confirm your account.",
                    "success"
                );

            }
        );



        /* =====================================
           GOOGLE SIGN UP
        ====================================== */

        googleButton.addEventListener(
            "click",
            async function () {

                googleButton.disabled = true;

                googleButton.textContent =
                    "Connecting to Google...";



                const {
                    error
                } =
                    await supabaseClient.auth.signInWithOAuth({

                        provider: "google",

                        options: {

                            redirectTo:
                                window.location.origin + "/"

                        }

                    });



                /* ================================
                   GOOGLE ERROR
                ================================= */

                if (error) {

                    googleButton.disabled = false;

                    googleButton.textContent =
                        "Continue with Google";


                    showMessage(
                        error.message,
                        "error"
                    );

                }

            }
        );

    </script>


</body>

</html>
