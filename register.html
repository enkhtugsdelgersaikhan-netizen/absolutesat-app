<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register — AbsoluteSAT</title>

    <link rel="icon" type="image/png" href="Favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a href="/" class="logo-link">
                <img
                    src="Logo.png"
                    alt="AbsoluteSAT"
                    class="site-logo"
                >
            </a>

        </div>
    </header>


    <main class="auth-page">

        <div class="auth-card">

            <h1>Create your account</h1>

            <p class="auth-subtitle">
                Start your SAT preparation with AbsoluteSAT.
            </p>


            <button
                id="google-login"
                class="google-button"
                type="button"
            >

                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        fill="#4285F4"
                        d="M21.35 12.23c0-.78-.07-1.53-.22-2.25H12v4.26h5.23a4.47 4.47 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.92-4.18 2.92-7.38z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.99c2.63 0 4.84-.87 6.45-2.38l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.99z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.54 14.06A5.86 5.86 0 0 1 6.23 12c0-.71.12-1.4.31-2.06V7.42H3.3A9.99 9.99 0 0 0 2.25 12c0 1.65.4 3.2 1.05 4.58l3.24-2.52z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 5.91c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 2.93 14.63 2 12 2a9.74 9.74 0 0 0-8.7 5.42l3.24 2.52C7.31 7.63 9.46 5.91 12 5.91z"
                    />

                </svg>

                Continue with Google

            </button>


            <div
                id="auth-message"
                class="auth-message"
                aria-live="polite"
            ></div>


            <p class="auth-footer-text">

                Already have an account?

                <a href="/signin">
                    Sign in
                </a>

            </p>

        </div>

    </main>


    <script>

        const googleButton =
            document.getElementById("google-login");

        const message =
            document.getElementById("auth-message");


        googleButton.addEventListener("click", async () => {

            googleButton.disabled = true;

            googleButton.textContent =
                "Connecting to Google...";

            message.textContent = "";


            const { error } =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            window.location.origin + "/"

                    }

                });


            if (error) {

                console.error(error);

                message.textContent =
                    error.message;

                googleButton.disabled = false;

                googleButton.textContent =
                    "Continue with Google";

            }

        });

    </script>

</body>
</html>
