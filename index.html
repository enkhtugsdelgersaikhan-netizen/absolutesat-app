<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AbsoluteSAT</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Favicon.png">

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="header-container">


            <!-- LOGO -->

            <a href="index.html" class="logo-link">

                <img
                    src="Logo.png"
                    alt="AbsoluteSAT Logo"
                    class="logo"
                >

            </a>



            <!-- NAVIGATION -->

            <nav class="navigation">

                <a
                    href="/"
                    class="nav-button active"
                >
                    Home
                </a>

                <a
                    href="question-sets"
                    class="nav-button"
                >
                    Question Sets
                </a>

                <a
                    href="mock-tests"
                    class="nav-button"
                >
                    Mock Tests
                </a>

                <a
                    href="vocab"
                    class="nav-button"
                >
                    Vocab
                </a>

                <a
                    href="analytics"
                    class="nav-button"
                >
                    Analytics
                </a>

            </nav>



            <!-- REGISTER / SIGN IN -->

            <div class="auth-buttons">

                <a
                    href="register"
                    class="register-button"
                >
                    Register
                </a>

                <a
                    href="signin"
                    class="signin-button"
                >
                    Sign In
                </a>

            </div>



            <!-- SOCIAL MEDIA -->

            <div class="social-buttons">


                <!-- Instagram -->

                <a
                    href="https://www.instagram.com/absolute_school_of_english/"
                    class="social-button"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                        ></rect>

                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                        ></circle>

                        <circle
                            cx="17.5"
                            cy="6.5"
                            r="1"
                        ></circle>

                    </svg>

                </a>



                <!-- YouTube -->

                <a
                    href="https://www.youtube.com/@AbsoluteSchoolofEnglish-oj3nr/featured"
                    class="social-button"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="YouTube"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="6"
                            width="18"
                            height="12"
                            rx="4"
                        ></rect>

                        <polygon
                            points="10,9 16,12 10,15"
                        ></polygon>

                    </svg>

                </a>



                <!-- Facebook -->

                <a
                    href="https://www.facebook.com/AbsoluteToeflCenter"
                    class="social-button"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Facebook"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"
                        ></path>

                    </svg>

                </a>


            </div>



            <!-- MOBILE MENU -->

            <button
                class="mobile-menu-button"
                aria-label="Open navigation"
            >
                ☰
            </button>


        </div>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>
                    Master the <span>SAT.</span>
                </h1>

                <p>
                    Practice smarter. Test yourself. Track your progress.
                </p>

            </div>

        </section>

    </main>



    <!-- =========================================
         MOBILE MENU SCRIPT
    ========================================== -->

    <script>

        const menuButton =
            document.querySelector(".mobile-menu-button");

        const navigation =
            document.querySelector(".navigation");


        menuButton.addEventListener("click", () => {

            navigation.classList.toggle("mobile-open");

        });

    </script>


</body>

</html>
```
