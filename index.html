<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbsoluteSAT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f2fbfb; }
    .text-dark-teal { color: #0d4b50; }
    .bg-dark-teal { background-color: #0d4b50; }
    .bg-cyan-accent { background-color: #1ed2dc; }
    .bg-cyan-accent:hover { background-color: #12b7c0; }
    .text-cyan-accent { color: #00b4be; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-8 py-4 flex items-center justify-between">
      
      <!-- Top-Left Logo -->
      <a href="#" class="flex items-center">
        <img src="Logo.png" alt="AbsoluteSAT Logo" class="h-16 w-auto object-contain">
      </a>

      <!-- Navigation Buttons -->
      <nav class="flex items-center space-x-8 text-sm font-bold tracking-wider uppercase">
        <a href="#home" class="text-dark-teal hover:text-cyan-accent transition">Home</a>
        <a href="#question-sets" class="text-slate-600 hover:text-dark-teal transition">Question sets</a>
        <a href="#mock-tests" class="text-slate-600 hover:text-dark-teal transition">Mock tests</a>
        <a href="#analytics" class="text-slate-600 hover:text-dark-teal transition">Analytics</a>
        
        <a href="#register" class="bg-cyan-accent text-slate-900 font-extrabold px-6 py-2.5 rounded hover:opacity-90 transition shadow-sm ml-4">
          Register
        </a>
      </nav>

    </div>
  </header>

  <!-- Workspace Container -->
  <main class="max-w-7xl mx-auto px-8 py-12 flex-1 w-full">
  </main>

</body>
</html>
