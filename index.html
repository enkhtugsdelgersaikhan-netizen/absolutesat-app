<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbsoluteSAT - SAT Preparation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for matching the feel of absolute.mn but with teal/cyan colors */
        .text-accent-teal { color: #008080; } /* Custom Teal */
        .text-accent-cyan { color: #00ced1; } /* Custom Cyan */
        .bg-accent-teal { background-color: #008080; } /* Custom Teal */
        .bg-accent-teal-hover:hover { background-color: #006666; } /* Custom Darker Teal for hover */
        .text-accent-cyan-hover:hover { color: #20b2aa; } /* Custom teal for cyan text hover */
    </style>
</head>
<body class="bg-white text-gray-900 font-sans antialiased">

    <!-- Top Navigation Bar -->
    <nav class="flex items-center justify-between p-6 max-w-7xl mx-auto">
        <!-- Logo Area - exactly like the absolute.mn reference placement -->
        <div class="logo-area">
            <a href="#" class="block">
                <img src="image_0.png" alt="AbsoluteSAT Logo" class="h-16 w-auto block">
            </blank>
        </div>

        <!-- Right Side Nav Items - like the reference but themed teal/cyan -->
        <div class="nav-right flex items-center space-x-10 text-sm">
            <a href="#" class="font-medium text-teal-700 hover:text-cyan-600 transition">Home</a>
            <a href="#" class="font-medium text-teal-700 hover:text-cyan-600 transition">Courses</a>
            <a href="#" class="font-medium text-teal-700 hover:text-cyan-600 transition">Practice</a>
            <a href="#" class="font-medium text-teal-700 hover:text-cyan-600 transition">About Us</a>

            <!-- Language and Menu items like the ref but with custom teal/cyan theme -->
            <div class="flex items-center space-x-3 text-teal-700">
                <button class="flex items-center font-medium hover:text-cyan-600 transition">
                    EN 
                    <svg class="ml-1 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <button class="hover:text-cyan-600 transition">
                    <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Hero Section - matching the structure and elements of absolute.mn -->
    <main class="text-center px-6 py-16 md:py-24 max-w-7xl mx-auto">
        <!-- Headline with cyan highlight -->
        <h1 class="text-5xl md:text-6xl font-extrabold leading-tight text-gray-900 mb-6">
            Let us be your bridge to the <span class="text-accent-cyan">***Future***</span>
        </h1>
        
        <!-- Sub-headline text -->
        <p class="text-gray-600 text-xl max-w-3xl mx-auto mb-16">
            We are committed to providing a stimulating, secure, enjoyable environment for learning Digital SAT preparation.
        </p>
        
        <!-- Call to action buttons with teal and cyan colors -->
        <div class="flex items-center justify-center space-x-12 mb-16 md:mb-24">
            <button class="bg-accent-teal text-white font-semibold text-lg px-12 py-4 rounded-xl shadow-lg bg-accent-teal-hover transition duration-300">
                Register Now
            </button>
            <a href="#" class="flex items-center text-accent-cyan text-lg font-medium text-accent-cyan-hover group transition duration-300">
                Read more <span class="ml-2 group-hover:ml-3 transition-all">→</span>
            </a>
        </div>
        
        <!-- Hero image with teal/cyan colors and positive university feel, matching ref layout -->
        <div class="max-w-6xl mx-auto rounded-3xl overflow-hidden shadow-2xl relative">
            <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=1600&h=900&auto=format&fit=crop" 
                 alt="Two young students smiling while looking at a laptop, with a modern, light-filled university library background, featuring subtle cyan and teal ambient lighting"
                 class="w-full h-auto">
            <div class="absolute inset-0 bg-teal-900/10 mix-blend-multiply rounded-3xl"></div>
            <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-white to-transparent"></div>
        </div>
    </main>

    <!-- Footer or other sections could go here -->
    <footer class="py-10 text-center text-gray-500 border-t border-gray-100 mt-24">
        &copy; 2024 AbsoluteSAT. All rights reserved. Teal & Cyan only.
    </footer>

</body>
</html>
