name: Ingest audited math batch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.head_commit.message == 'Run audited math batch ingestion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited batch
        run: python3 .github/scripts/ingest_audited_math_batch.py

      - name: Commit updated bank
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add math-question-bank.json
          if git diff --cached --quiet; then
            echo "No bank changes needed."
            exit 0
          fi
          git commit -m "Finish audited math batch ingestion"
          git push origin HEAD:main
