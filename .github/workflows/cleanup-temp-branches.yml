name: Cleanup temporary branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-main temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in             question-bank-icon-difficulty-edge             question-icon-difficulty-edge             question-icon-difficulty-edge-final             systemic-math-typography-normalizer
          do
            encoded_branch=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            status=$(curl -sS -o /tmp/delete-response.json -w "%{http_code}"               -X DELETE               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/git/refs/heads/$encoded_branch")
            if [ "$status" != "204" ] && [ "$status" != "422" ]; then
              cat /tmp/delete-response.json
              exit 1
            fi
          done
