<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | LexLogica</title>
    <link rel="icon" type="image/png" href="/Favicon.png?v=b2788e22">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css?v=google-auth-1"
    >

    <style>

        .login-page {
            min-height: calc(100vh - 92px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px;
            background: #f8fafc;
        }

        .login-card {
            width: min(450px, 100%);
            padding: 42px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.07);
        }

        .login-card h1 {
            margin: 0 0 8px;
            color: #0f172a;
            font-size: 30px;
            font-weight: 700;
        }

        .login-subtitle {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0f9f9a;
            box-shadow: 0 0 0 3px rgba(15, 159, 154, 0.1);
        }

        .login-submit {
            width: 100%;
            margin-top: 5px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #0f9f9a;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #0b8985;
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-message {
            display: none;
            margin-top: 17px;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-message.error {
            display: block;
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .login-message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .login-register {
            margin-top: 23px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .login-register a {
            color: #0f9f9a;
            font-weight: 600;
            text-decoration: none;
        }

        .login-register a:hover {
            text-decoration: underline;
        }

        .google-login {
            width: 100%;
            min-height: 52px;
            margin-top: 6px;
            padding: 11px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-login:hover {
            background: #f8fafc;
        }

        .google-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .google-login-icon {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
        }

        .google-only-auth-card {
            text-align: center;
        }

        .google-auth-mark {
            width: 48px;
            height: 48px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
        }

        .google-auth-mark .google-login-icon {
            width: 24px;
            height: 24px;
            flex-basis: 24px;
        }

        .google-account-note {
            margin: 14px 0 0;
            color: #7b8798;
            font-size: 12px;
            line-height: 1.55;
        }

        .google-primary-login.is-loading span {
            opacity: 0.72;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e2e8f0;
        }

        @media (max-width: 480px) {

            .login-page {
                padding: 40px 15px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-card h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<header class="header"><div class="header-container"><a href="/" class="logo-link" aria-label="LexLogica home"><img src="/Logo.png" alt="LexLogica" class="logo"></a><nav class="navigation" aria-label="Main navigation"><a href="/mathematics" class="nav-button">Mathematics</a><a href="/mock-tests" class="nav-button">Mock Tests</a><a href="/reading-writing" class="nav-button">Reading and Writing</a></nav><a href="/dashboard" class="dashboard-button site-dashboard" hidden aria-hidden="true">Dashboard</a><div class="auth-buttons"><a href="/register" class="register-button">Sign up</a><a href="/login" class="login-button">Log in</a></div><button class="mobile-menu-button" aria-label="Open navigation" aria-expanded="false" type="button">☰</button></div></header>


<main class="login-page">

    <div class="login-card google-only-auth-card">

        <div class="google-auth-mark" aria-hidden="true">
            <svg class="google-login-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.35 12.27c0-.78-.07-1.53-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.39z"></path>
                    <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.5A9.74 9.74 0 0 0 12 21.5z"></path>
                    <path fill="#FBBC05" d="M6.53 13.6A5.85 5.85 0 0 1 6.23 12c0-.56.1-1.1.3-1.6V7.9H3.29A9.5 9.5 0 0 0 2.5 12c0 1.48.35 2.88.79 4.1l3.24-2.5z"></path>
                    <path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.49 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.4l3.24 2.5C7.3 8.1 9.46 6.38 12 6.38z"></path>
                </svg>
        </div>

        <h1>Welcome back.</h1>

        <p class="login-subtitle">
            LexLogica accounts use Google sign-in only.
        </p>

        <button
            type="button"
            id="google-login"
            class="google-login google-primary-login"
        >
            <svg class="google-login-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.35 12.27c0-.78-.07-1.53-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.39z"></path>
                    <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.5A9.74 9.74 0 0 0 12 21.5z"></path>
                    <path fill="#FBBC05" d="M6.53 13.6A5.85 5.85 0 0 1 6.23 12c0-.56.1-1.1.3-1.6V7.9H3.29A9.5 9.5 0 0 0 2.5 12c0 1.48.35 2.88.79 4.1l3.24-2.5z"></path>
                    <path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.49 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.4l3.24 2.5C7.3 8.1 9.46 6.38 12 6.38z"></path>
                </svg>
            <span>Sign in with Google</span>
        </button>

        <p class="google-account-note">
            Use the Google account you want linked to your LexLogica progress.
        </p>

        <div
            id="login-message"
            class="login-message"
            aria-live="polite"
        ></div>

        <div class="login-register">
            New to LexLogica?
            <a href="/register">Create your account</a>
        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://ikvvixdyztyqqxkveois.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_nO5HUWPidf4U_MMK0-HYEA_vuOR0POg";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

const googleLogin =
    document.getElementById("google-login");

const loginMessage =
    document.getElementById("login-message");

function getRedirectUrl() {
    const params =
        new URLSearchParams(
            window.location.search
        );

    const redirect =
        params.get("redirect");

    if (
        redirect &&
        redirect.startsWith("/")
    ) {
        return redirect;
    }

    return "/question-bank";
}

function isGoogleUser(user) {
    return Boolean(
        user &&
        (
            user.app_metadata?.provider === "google" ||
            (
                Array.isArray(
                    user.app_metadata?.providers
                ) &&
                user.app_metadata.providers.includes(
                    "google"
                )
            ) ||
            (
                Array.isArray(
                    user.identities
                ) &&
                user.identities.some(
                    identity =>
                        identity?.provider ===
                        "google"
                )
            )
        )
    );
}

function showMessage(message, type) {
    loginMessage.textContent =
        message;

    loginMessage.className =
        `login-message ${type}`;
}

async function checkExistingSession() {
    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();

    if (
        user &&
        isGoogleUser(user)
    ) {
        window.location.replace(
            getRedirectUrl()
        );
        return;
    }

    if (user) {
        await supabaseClient.auth.signOut({
            scope: "local"
        });
    }
}

googleLogin.addEventListener(
    "click",
    async () => {
        googleLogin.disabled = true;
        googleLogin.classList.add(
            "is-loading"
        );

        const redirectUrl =
            window.location.origin +
            getRedirectUrl();

        const {
            error
        } =
            await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: redirectUrl,
                    queryParams: {
                        prompt: "select_account"
                    }
                }
            });

        if (error) {
            console.error(error);

            showMessage(
                error.message,
                "error"
            );

            googleLogin.disabled = false;
            googleLogin.classList.remove(
                "is-loading"
            );
        }
    }
);

const menuButton =
    document.querySelector(
        ".mobile-menu-button"
    );

const navigation =
    document.querySelector(
        ".navigation"
    );

if (
    menuButton &&
    navigation
) {
    menuButton.addEventListener(
        "click",
        () => {
            const isOpen =
                navigation.classList.toggle(
                    "mobile-open"
                );

            menuButton.setAttribute(
                "aria-expanded",
                isOpen
                    ? "true"
                    : "false"
            );
        }
    );
}

checkExistingSession();

</script>


</body>

</html>
