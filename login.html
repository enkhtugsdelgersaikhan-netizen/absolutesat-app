<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AbsolutePrep</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .login-page {
            min-height: calc(100vh - 92px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px;
            background: #f8fafc;
        }

        .login-card {
            width: min(450px, 100%);
            padding: 42px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.07);
        }

        .login-card h1 {
            margin: 0 0 8px;
            color: #0f172a;
            font-size: 30px;
            font-weight: 700;
        }

        .login-subtitle {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #0f172a;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0f9f9a;
            box-shadow: 0 0 0 3px rgba(15, 159, 154, 0.1);
        }

        .login-submit {
            width: 100%;
            margin-top: 5px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #0f9f9a;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #0b8985;
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-message {
            display: none;
            margin-top: 17px;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-message.error {
            display: block;
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .login-message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .login-register {
            margin-top: 23px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .login-register a {
            color: #0f9f9a;
            font-weight: 600;
            text-decoration: none;
        }

        .login-register a:hover {
            text-decoration: underline;
        }

        .google-login {
            width: 100%;
            margin-top: 14px;
            padding: 11px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-login:hover {
            background: #f8fafc;
        }

        .google-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e2e8f0;
        }

        @media (max-width: 480px) {

            .login-page {
                padding: 40px 15px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-card h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-container">

        <a
            href="/"
            class="logo-link"
        >
            <img
                src="Logo.png"
                alt="AbsolutePrep Logo"
                class="logo"
            >
        </a>


        <nav class="navigation">

            <a
                href="/"
                class="nav-button"
            >
                Home
            </a>

            <a
                href="/question-sets"
                class="nav-button"
            >
                Question Sets
            </a>

            <a
                href="/mock-tests"
                class="nav-button"
            >
                Mock Tests
            </a>

            <a
                href="/vocab"
                class="nav-button"
            >
                Vocab
            </a>

            <a
                href="/analytics"
                class="nav-button"
            >
                Analytics
            </a>

        </nav>


        <div class="auth-buttons">

            <a
                href="/register"
                class="register-button"
            >
                Register
            </a>

            <a
                href="/login"
                class="login-button"
            >
                Login
            </a>

        </div>


        <div class="social-buttons">

            <a
                href="https://www.instagram.com/absolute_school_of_english/"
                class="social-button"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                    ></rect>
                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>
                    <circle
                        cx="17.5"
                        cy="6.5"
                        r="1"
                    ></circle>
                </svg>
            </a>


            <a
                href="https://www.youtube.com/@AbsoluteSchoolofEnglish-oj3nr/featured"
                class="social-button"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="YouTube"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect
                        x="3"
                        y="6"
                        width="18"
                        height="12"
                        rx="4"
                    ></rect>
                    <polygon
                        points="10,9 16,12 10,15"
                    ></polygon>
                </svg>
            </a>


            <a
                href="https://www.facebook.com/AbsoluteToeflCenter"
                class="social-button"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="
                        M14 8h3V4h-3
                        c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9
                        c0-.7.3-1 1-1z
                    "></path>
                </svg>
            </a>

        </div>


        <button
            class="mobile-menu-button"
            aria-label="Open navigation"
            aria-expanded="false"
            type="button"
        >
            ☰
        </button>

    </div>

</header>


<main class="login-page">

    <div class="login-card">

        <h1>Welcome back.</h1>

        <p class="login-subtitle">
            Sign in to continue your SAT preparation.
        </p>


        <form
            id="login-form"
            class="login-form"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="login-submit"
                class="login-submit"
            >
                Login
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            id="google-login"
            class="google-login"
        >
            Continue with Google
        </button>


        <div
            id="login-message"
            class="login-message"
        ></div>


        <div class="login-register">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://ikvvixdyztyqqxkveois.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_nO5HUWPidf4U_MMK0-HYEA_vuOR0POg";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const loginForm =
    document.getElementById("login-form");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginSubmit =
    document.getElementById("login-submit");

const googleLogin =
    document.getElementById("google-login");

const loginMessage =
    document.getElementById("login-message");


function getRedirectUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const redirect =
        params.get("redirect");

    if (
        redirect &&
        redirect.startsWith("/")
    ) {
        return redirect;
    }

    return "/question-sets";
}


function showMessage(
    message,
    type
) {

    loginMessage.textContent =
        message;

    loginMessage.className =
        `login-message ${type}`;

}


async function checkExistingSession() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();

    if (user) {

        window.location.replace(
            getRedirectUrl()
        );

    }

}


/* =================================
   EMAIL LOGIN
================================= */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        loginSubmit.disabled = true;

        loginSubmit.textContent =
            "Logging in...";

        loginMessage.className =
            "login-message";


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });


        if (error) {

            console.error(error);

            showMessage(
                error.message,
                "error"
            );

            loginSubmit.disabled =
                false;

            loginSubmit.textContent =
                "Login";

            return;
        }


        if (!data.session) {

            showMessage(
                "Login succeeded, but no session was created. Please try again.",
                "error"
            );

            loginSubmit.disabled =
                false;

            loginSubmit.textContent =
                "Login";

            return;
        }


        showMessage(
            "Login successful. Redirecting...",
            "success"
        );


        setTimeout(
            () => {

                window.location.replace(
                    getRedirectUrl()
                );

            },
            300
        );

    }
);


/* =================================
   GOOGLE LOGIN
================================= */

googleLogin.addEventListener(
    "click",
    async () => {

        googleLogin.disabled =
            true;

        googleLogin.textContent =
            "Connecting...";


        const redirectUrl =
            window.location.origin +
            getRedirectUrl();


        const {
            error
        } =
            await supabaseClient.auth.signInWithOAuth({

                provider: "google",

                options: {
                    redirectTo: redirectUrl
                }

            });


        if (error) {

            console.error(error);

            showMessage(
                error.message,
                "error"
            );

            googleLogin.disabled =
                false;

            googleLogin.textContent =
                "Continue with Google";

        }

    }
);


/* =================================
   AUTH STATE
================================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            event === "SIGNED_IN" &&
            session
        ) {

            window.location.replace(
                getRedirectUrl()
            );

        }

    }
);


/* =================================
   MOBILE MENU
================================= */

const menuButton =
    document.querySelector(
        ".mobile-menu-button"
    );

const navigation =
    document.querySelector(
        ".navigation"
    );


if (
    menuButton &&
    navigation
) {

    menuButton.addEventListener(
        "click",
        () => {

            const isOpen =
                navigation.classList.toggle(
                    "mobile-open"
                );


            menuButton.setAttribute(
                "aria-expanded",
                isOpen ? "true" : "false"
            );

        }
    );

}


/* =================================
   START
================================= */

checkExistingSession();

</script>


</body>

</html>
