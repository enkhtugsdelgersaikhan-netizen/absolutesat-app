<script>
/* LOGIN PAGE THEME BRIDGE */
(() => {
    const key = "lexlogica-theme";

    const apply = mode => {
        const dark = mode === "dark";
        document.documentElement.classList.toggle("lexlogica-dark-mode", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";

        const button = document.getElementById("lexlogica-theme-toggle");
        if (!button) return;

        button.setAttribute("aria-pressed", dark ? "true" : "false");
        button.setAttribute(
            "aria-label",
            dark ? "Switch to light mode" : "Switch to dark mode"
        );

        const symbol = button.querySelector(".theme-toggle-symbol");
        const label = button.querySelector(".theme-toggle-label");

        if (symbol) symbol.textContent = dark ? "☀" : "◐";
        if (label) label.textContent = dark ? "Light" : "Dark";
    };

    let stored = null;
    try {
        stored = localStorage.getItem(key);
    } catch {}

    apply(stored === "dark" ? "dark" : "light");

    const header = document.querySelector(".header-container");
    if (!header || document.getElementById("lexlogica-theme-toggle")) return;

    const button = document.createElement("button");
    button.id = "lexlogica-theme-toggle";
    button.className = "theme-toggle-button";
    button.type = "button";
    button.innerHTML =
        '<span class="theme-toggle-symbol" aria-hidden="true">◐</span>' +
        '<span class="theme-toggle-label">Dark</span>';

    const mobileMenu = header.querySelector(".mobile-menu-button");
    header.insertBefore(button, mobileMenu || null);

    button.addEventListener("click", () => {
        const next =
            document.documentElement.classList.contains("lexlogica-dark-mode")
                ? "light"
                : "dark";

        try {
            localStorage.setItem(key, next);
        } catch {}

        apply(next);
    });

    apply(stored === "dark" ? "dark" : "light");
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ikvvixdyztyqqxkveois.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nO5HUWPidf4U_MMK0-HYEA_vuOR0POg";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

const googleLogin =
    document.getElementById("google-login");

const loginMessage =
    document.getElementById("login-message");

function getRedirectUrl() {
    const params =
        new URLSearchParams(
            window.location.search
        );

    const redirect =
        params.get("redirect");

    return (
        redirect &&
        redirect.startsWith("/")
            ? redirect
            : "/question-bank"
    );
}

function isGoogleUser(user) {
    return Boolean(
        user &&
        (
            user.app_metadata?.provider === "google" ||
            (
                Array.isArray(
                    user.app_metadata?.providers
                ) &&
                user.app_metadata.providers.includes(
                    "google"
                )
            ) ||
            (
                Array.isArray(
                    user.identities
                ) &&
                user.identities.some(
                    identity =>
                        identity?.provider === "google"
                )
            )
        )
    );
}

function showMessage(message) {
    loginMessage.textContent =
        message;

    loginMessage.className =
        "google-auth-message error";
}

async function checkExistingSession() {
    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();

    if (
        user &&
        isGoogleUser(user)
    ) {
        window.location.replace(
            getRedirectUrl()
        );
        return;
    }

    if (user) {
        await supabaseClient.auth.signOut({
            scope: "local"
        });
    }
}

googleLogin.addEventListener(
    "click",
    async () => {
        googleLogin.disabled = true;

        const label =
            googleLogin.querySelector("span");

        if (label) {
            label.textContent =
                "Opening Google…";
        }

        const {
            error
        } =
            await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo:
                        window.location.origin +
                        getRedirectUrl(),
                    queryParams: {
                        prompt:
                            "select_account"
                    }
                }
            });

        if (error) {
            showMessage(
                error.message
            );

            googleLogin.disabled = false;

            if (label) {
                label.textContent =
                    "Continue with Google";
            }
        }
    }
);

checkExistingSession();
</script>
