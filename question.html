<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question | LexLogica</title>
    <link rel="icon" type="image/png" href="/Favicon.png?v=b2788e22">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=subjects-1">
    <link rel="stylesheet" href="question.css?v=8">
</head>

<body>

<header class="header"><div class="header-container"><a href="/" class="logo-link" aria-label="LexLogica home"><img src="/Logo.png" alt="LexLogica" class="logo"></a><nav class="navigation" aria-label="Main navigation"><a id="question-nav-math" href="/mathematics" class="nav-button">Mathematics</a><a href="/mock-tests" class="nav-button">Mock Tests</a><a id="question-nav-reading" href="/reading-writing" class="nav-button">Reading and Writing</a></nav><a href="/dashboard" class="dashboard-button site-dashboard" hidden aria-hidden="true">Dashboard</a><div class="auth-buttons"><a href="/login" class="login-button">Login</a></div><button class="mobile-menu-button" aria-label="Open navigation" aria-expanded="false" type="button">☰</button></div></header>


<main class="question-page">

    <!-- LOADING -->
    <section id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading questions...</p>
    </section>


    <!-- QUESTION APPLICATION -->
    <section id="question-app" class="question-app hidden">

        <div class="question-topbar">

            <div class="question-set-info">
                <span class="small-label">QUESTION</span>
                <h1 id="set-title">Information and Ideas</h1>
            </div>

            <div class="question-topbar-actions">
                <button
                    id="next-question-button"
                    class="next-question-button topbar-next-button hidden"
                    type="button"
                >
                    Next Question
                </button>

                <div class="timer-container">
                    <span class="timer-label">TIME ON QUESTION</span>
                    <div id="timer" class="timer">00:00</div>
                </div>
            </div>

        </div>


        <div class="question-layout">

            <div class="sat-question-pane sat-passage-pane">

                <div class="sat-pane-label">
                    PASSAGE
                </div>

                <div
                    id="question-passage"
                    class="question-passage"
                ></div>

            </div>


            <div class="sat-question-pane sat-answer-pane">

                <div class="question-progress-row">

                    <span id="question-number">
                        Question 1
                    </span>

                    <button
                        id="review-button"
                        class="review-button"
                        type="button"
                        aria-pressed="false"
                    >
                        <svg
                            class="bookmark-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3.8L6 21V4.5z"></path>
                        </svg>
                        <span id="review-text">Mark for Review</span>
                    </button>

                </div>

                <div class="question-card">

                    <div
                        id="question-text"
                        class="question-text"
                    ></div>

                    <div
                        id="choices"
                        class="choices"
                    ></div>

                    <div
                        id="answer-feedback"
                        class="answer-feedback hidden"
                        aria-live="polite"
                    >
                        <div
                            id="answer-feedback-title"
                            class="answer-feedback-title"
                        ></div>

                        <div
                            id="answer-feedback-explanation"
                            class="answer-feedback-explanation"
                        ></div>
                    </div>

                </div>


                <div class="question-actions">

                    <button
                        id="check-answer-button"
                        class="check-answer-button"
                        type="button"
                    >
                        Check the selected answer
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- RESULTS -->
    <section id="results-screen" class="results-screen hidden">

        <div class="results-card">

            <div class="results-heading">
                <span class="results-eyebrow">SET COMPLETE</span>
                <h1>Practice Results</h1>
                <p id="results-set-title">
                    Information and Ideas
                </p>
            </div>


            <div class="score-circle">
                <div id="score-number">0%</div>
                <span>Score</span>
            </div>


            <div class="results-stats">

                <div class="result-stat">
                    <strong id="correct-count">0</strong>
                    <span>Correct</span>
                </div>

                <div class="result-stat">
                    <strong id="incorrect-count">0</strong>
                    <span>Incorrect</span>
                </div>

                <div class="result-stat">
                    <strong id="unanswered-count">0</strong>
                    <span>Unanswered</span>
                </div>

            </div>


            <div class="results-message" id="results-message"></div>


            <div class="results-actions">

                <button
                    id="review-results-button"
                    class="results-secondary-button"
                    type="button"
                >
                    Review Questions
                </button>

                <a
                    id="back-to-question-bank"
                    href="/reading-question-bank"
                    class="results-primary-button"
                >
                    Back to Question Bank
                </a>

            </div>

        </div>


        <!-- RESULTS REVIEW -->
        <div
            id="results-review"
            class="results-review hidden"
        >

            <h2>Question Review</h2>

            <div id="results-review-list"></div>

        </div>

    </section>

</main>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=subjects-1"></script>
<script src="question.js?v=18"></script>

</body>
</html>
